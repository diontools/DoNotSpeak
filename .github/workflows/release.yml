name: Android CI

on:
  push:
    branches:
      - master
      - dev

# GITHUB_TOKEN は checkout 以外で使わない
permissions:
  contents: read

# 同一ブランチのジョブを直列化する。master は Play の edit が競合しないよう
# 実行中のものを止めない。dev は最新のコミットだけ検証できればよい。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    working-directory: src

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # src/gradle/gradle-daemon-jvm.properties の toolchainVersion / toolchainVendor と
      # 一致させる。ずれると Gradle が JDK を毎回ダウンロードする。
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          cache: gradle

      - name: Generate local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "KEYSTORE=../release.keystore" >> local.properties
          echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
          echo "KEY_ALIAS=$KEY_ALIAS" >> local.properties
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties

      # src/gradlew は git 上 100644 で登録されているため必要
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew bundleRelease

      - name: Upload aab file
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: ./src/app/build/outputs/bundle/release/app-release.aab

      # ここから下は master のみ。dev はビルド検証だけで終わる。
      - name: Setup Node
        if: github.ref == 'refs/heads/master'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install packages
        if: github.ref == 'refs/heads/master'
        run: npm ci
        working-directory: scripts

      - name: Generate credentials
        if: github.ref == 'refs/heads/master'
        env:
          PUBLISHER_CREDENTIALS_BASE64: ${{ secrets.PUBLISHER_CREDENTIALS_BASE64 }}
        run: echo "$PUBLISHER_CREDENTIALS_BASE64" | base64 -d > publisher/credentials.json
        working-directory: scripts

      - name: Upload to Google Play
        if: github.ref == 'refs/heads/master'
        run: npm run upload
        working-directory: scripts
